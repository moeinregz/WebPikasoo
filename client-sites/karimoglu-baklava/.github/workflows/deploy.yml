# ===== Deploy — «باقلوا کریم اغلو» (Prompt 15، بخش‌های ۹ و ۱۰) =====
#
# فقط بعد از موفقیت کامل CI (lint/typecheck/test/build/audit) اجرا می‌شود —
# هرگز مستقیم روی هر Push.
#
# ⚠️ TODO تیم (الزام صریح Prompt — حدس زده نشده): این Workflow به یک سرور
# واقعی (IP/Hostname)، یک Registry تصویر Docker، و Secretهای SSH نیاز دارد
# که هنوز مشخص نشده‌اند. مقادیر زیر همه از GitHub Secrets/Environments
# خوانده می‌شوند (هرگز Hardcode نشده) — تا وقتی این‌ها در تنظیمات Repository
# ست نشوند، این Workflow اجرا نمی‌شود (نه این‌که با مقدار جعلی اجرا شود).
# رجوع به docs/deployment-guide.md برای فهرست دقیق Secretهای لازم.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy → Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # «Environment» در تنظیمات GitHub Repository باید از قبل ساخته شود؛
    # Secretهای این محیط (SSH_HOST، SSH_KEY، ...) جدا از Production نگه
    # داشته می‌شوند تا هرگز قاطی نشوند (بخش ۲ Prompt: «Environment
    # Variableها نباید بین محیط‌ها اشتباه استفاده شوند»)
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Push Image (Staging Tag)
        run: |
          echo "TODO تیم: دستور واقعی Build/Push به Registry انتخاب‌شده اینجا می‌آید"
          echo "نمونه: docker build -t ${{ secrets.REGISTRY }}/karimoglu-web:staging-${{ github.sha }} ."
          echo "نمونه: docker push ${{ secrets.REGISTRY }}/karimoglu-web:staging-${{ github.sha }}"

      - name: Deploy to Staging Server (SSH)
        run: |
          echo "TODO تیم: اتصال SSH به سرور Staging و اجرای docker-compose pull/up اینجا می‌آید"
          echo "پیش‌نیاز: Secrets STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY"

      - name: Run Pending DB Migrations (Staging)
        run: |
          echo "TODO تیم: node scripts/migrate.mjs باید *قبل* از Restart برنامه، روی سرور Staging اجرا شود"

      - name: Smoke Test (Staging)
        run: |
          echo "TODO تیم: بخش ۲۳ Prompt — حداقل Homepage/Health/Admin Login باید بعد از Deploy چک شوند"
          echo "نمونه: curl -f https://staging.STAGING_DOMAIN_TODO/api/health"

  deploy-production:
    name: Deploy → Production (نیازمند تأیید دستی)
    needs: deploy-staging
    runs-on: ubuntu-latest
    # ⚠️ الزام صریح بخش ۱۱ Prompt: «Production Deploy نباید صرفاً با Push
    # اشتباهی انجام شود». راه‌حل: این Job به یک GitHub Environment به‌نام
    # "production" وابسته است که در تنظیمات Repository باید «Required
    # reviewers» روی آن فعال شود — یعنی حتی بعد از موفقیت Staging، این Job
    # تا وقتی یک نفر مشخص (مثلاً مدیر فنی) دستی تأیید نکند، اصلاً شروع
    # نمی‌شود؛ GitHub خودش این توقف را تضمین می‌کند، نه این Workflow.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-Deploy Backup Reminder
        run: |
          echo "⚠️ الزام صریح بخش ۱۲ Prompt: قبل از هر Migration حساس، Backup لازم است."
          echo "TODO تیم: این مرحله باید واقعاً scripts/backup-db.mjs را روی سرور Production اجرا کند"
          echo "(از طریق SSH) نه صرفاً این پیام را چاپ کند — بعد از مشخص شدن سرور واقعی تکمیل شود."

      - name: Build & Push Image (Production Tag)
        run: |
          echo "TODO تیم: مشابه Staging، با Tag نسخه دقیق (نه latest) — مثلاً Git SHA یا Semver"

      - name: Deploy to Production Server (SSH)
        run: |
          echo "TODO تیم: docker-compose pull && docker-compose up -d روی سرور Production"

      - name: Run Pending DB Migrations (Production)
        run: |
          echo "TODO تیم: node scripts/migrate.mjs — فقط بعد از Backup موفق بالا"

      - name: Smoke Test (Production)
        run: |
          echo "TODO تیم: همان چک‌لیست Smoke Test بخش ۲۳ Prompt، این‌بار روی Domain واقعی Production"

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "طبق docs/rollback-guide.md: اگر هر مرحله بالا شکست بخورد، Image نسخه قبلی دوباره"
          echo "docker-compose up -d می‌شود و در صورت اجرای Migration ناموفق، از همان Backup این"
          echo "مرحله Restore انجام می‌شود (scripts/restore-db.mjs)."
